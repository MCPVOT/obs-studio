<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="170" viewBox="0 0 760 170" role="img" aria-label="Worker skill: click here for the agent skill">
  <title>WORKER SKILL — click here for the agent skill</title>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plate">
      <rect width="760" height="170" rx="6"/>
    </clipPath>
  </defs>

  <!-- The whole plate is a link: it opens the worker agent skill. -->
  <a href="https://github.com/obs-rust/obs-studio/blob/master/.claude/skills/obs-worker/SKILL.md"
     xlink:href="https://github.com/obs-rust/obs-studio/blob/master/.claude/skills/obs-worker/SKILL.md">
    <g clip-path="url(#plate)">
      <rect width="760" height="170" fill="#1b1d1f"/>
      <rect width="760" height="170" fill="url(#sheen)"/>
    </g>
    <rect x="1.5" y="1.5" width="757" height="167" rx="6" fill="none" stroke="#e8631a" stroke-width="3"/>

    <!-- WORKER SKILL, big and bold, in the rust accent -->
    <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-weight="bold" font-size="60" letter-spacing="3" text-rendering="geometricPrecision">
      <text x="36" y="84" fill="#010101" fill-opacity=".45" transform="translate(3,3)">WORKER SKILL</text>
      <text x="36" y="84" fill="#e8631a">WORKER SKILL</text>
    </g>

    <!-- the click line, same yellow as the arrow -->
    <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-weight="bold" font-size="27" letter-spacing="2" text-rendering="geometricPrecision">
      <text x="36" y="136" fill="#010101" fill-opacity=".45" transform="translate(2,2)">CLICK HERE FOR THE AGENT SKILL</text>
      <text x="36" y="136" fill="#f2b705">CLICK HERE FOR THE AGENT SKILL</text>
    </g>

    <!-- arrow: points down at the click line -->
    <g stroke="#f2b705" stroke-width="18" fill="none" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M676 30 V 96"/>
      <path d="M641 64 L676 102 L711 64"/>
    </g>
  </a>
</svg>