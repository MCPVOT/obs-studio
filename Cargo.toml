[workspace]
members = ["rust/*"]
exclude = ["rust/tools"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"
publish = false

# Shared third-party pins (exact, so loader behaviour cannot drift).
[workspace.dependencies]
libloading = "=0.8.9"

# Glob imports hide where a name comes from (#1873). Clippy keeps its
# defaults: `use super::*` in test modules and `*::prelude::*` stay allowed.
[workspace.lints.clippy]
wildcard_imports = "deny"
enum_glob_use = "deny"

[profile.release]
# libobs links the Rust staticlib; keep panics from unwinding across the C ABI.
panic = "abort"

# obs-media-io's video_fourcc parity test checks every u32 against the C
# oracle; optimized, it takes seconds instead of minutes in `cargo test`.
[profile.dev.package.obs-media-io]
opt-level = 3

# obs-graphics' category ceil/floor test checks every f32 bit pattern (#1298).
[profile.dev.package.obs-graphics]
opt-level = 3

# Repo Dylints (dylints/*; obs-rust/obs-studio#323). Run by the lint lane:
# `soldr cargo dylint --all -- --workspace --lib --bins`.
[workspace.metadata.dylint]
libraries = [{ path = "dylints/*" }]
