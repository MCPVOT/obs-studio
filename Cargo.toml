[workspace]
members = ["rust/*"]
exclude = ["rust/tools"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"
publish = false

[profile.release]
# libobs links the Rust staticlib; keep panics from unwinding across the C ABI.
panic = "abort"

# obs-media-io's video_fourcc parity test checks every u32 against the C
# oracle; optimized, it takes seconds instead of minutes in `cargo test`.
[profile.dev.package.obs-media-io]
opt-level = 3

# Repo Dylints (dylints/*; obs-rust/obs-studio#323). Run by the lint lane:
# `soldr cargo dylint --all -- --workspace --lib --bins`.
[workspace.metadata.dylint]
libraries = [{ path = "dylints/*" }]
