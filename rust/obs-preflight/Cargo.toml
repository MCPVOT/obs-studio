[package]
autotests = false
name = "obs-preflight"
version = "0.1.0"
description = "Headless OBS preflight scoring and bake-off planning"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
test = false
path = "src/lib.rs"

[[bin]]
test = false
name = "obs-preflight"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
proptest = "1"

[[test]]
name = "obs-tests-preflight"
path = "tests/preflight.rs"
