[package]
name = "obs-nvenc"
version = "0.1.0"
description = "Rust port of the plugins/obs-nvenc CUDA/NVENC driver loader"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# staticlib: plugins/obs-nvenc links it (not libobs-rust); see
# plugins/obs-nvenc/CMakeLists.txt.
crate-type = ["rlib", "staticlib"]

[dependencies]
libloading = { workspace = true }

[dev-dependencies]
obs-c-oracle = { path = "../obs-c-oracle" }
