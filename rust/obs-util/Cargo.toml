[package]
autotests = false
name = "obs-util"
version = "0.1.0"
description = "Rust ports of libobs/util"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# GIO_FOUND: os_inhibit_sleep_* on Linux and FreeBSD calls the portal and
# session D-Bus inhibitors (Rust) and portal inhibitor (C). Set by
# libobs-rust, which CMake drives (#1500, #1576).
gio = []

[dependencies]
# Unix errno values and pthread_setname_np in ffi/threading.rs.
libc = "0.2"
# SIMD substring search for dstr_replace (C uses libc strstr), #1297.
memchr = "2"

[dev-dependencies]
obs-c-oracle = { path = "../obs-c-oracle" }
proptest = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
