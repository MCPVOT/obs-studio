[package]
name = "obs-stream-rust"
version = "0.1.0"
description = "Start, stop and inspect OBS streaming over the obs-websocket v5 protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "obs-stream-rust"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
serde_json = "1.0.151"
sha2 = "0.11.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
