[package]
autotests = false
name = "obs-build"
version = "0.1.0"
description = "Cargo-driven native OBS build graph and cc::Build execution"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
libobs-integration = []

[dependencies]
dunce = "=1.0.5"
cc = { version = "=1.6.0", features = ["parallel"] }
pkg-config = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
libloading.workspace = true
tempfile = "=3.27.0"

[lib]
test = false

[[bin]]
name = "obs-build"
path = "src/bin/obs-build.rs"
test = false
bench = false
