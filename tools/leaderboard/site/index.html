<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>obs-rust Leaderboard</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800;900&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--steel:#1b1d1f;--steel2:#232628;--plate:#2c3033;--edge:#4a4f53;--hi:#6b7176;--fg:#e9e6df;--rust:#e8631a;--rust2:#b9480f;--cu:#3fa58a;--haz:#f2b705}
*{box-sizing:border-box;margin:0}
body{color:var(--fg);font:600 17px/1.35 "Barlow Condensed",sans-serif;letter-spacing:.02em;min-height:100vh;padding:28px 16px 36px;
background:
repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),
repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 4px),
linear-gradient(180deg,#25282a,#17191a)}
main{max-width:940px;margin:auto;border:3px solid var(--edge);background:var(--steel);box-shadow:0 0 0 2px #0c0d0e,inset 0 0 0 2px #0c0d0e;position:relative;padding:0 0 22px}
.rv{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a9095,#33373a 70%);box-shadow:0 1px 0 #000}
.rv.a{top:10px;left:10px}.rv.b{top:10px;right:10px}.rv.c{bottom:10px;left:10px}.rv.d{bottom:10px;right:10px}
.haz{height:16px;background:repeating-linear-gradient(-45deg,var(--haz) 0 14px,#111 14px 28px);border-bottom:3px solid #0c0d0e}
.haz.bot{border:0;border-top:3px solid #0c0d0e;margin-top:22px;margin-bottom:-22px}
header{display:flex;align-items:center;gap:26px;padding:28px 40px 22px;border-bottom:3px solid var(--edge)}
header img{width:132px;height:132px;flex:none;filter:drop-shadow(0 3px 0 #000)}
h1{font:900 clamp(38px,8vw,80px)/.9 "Big Shoulders Stencil Display",sans-serif;text-transform:uppercase;letter-spacing:.03em;color:var(--fg)}
h1 em{font-style:normal;color:var(--rust)}
.sub{margin-top:10px;color:#a9aeb2;text-transform:uppercase;letter-spacing:.14em;font-size:15px}
.sub b{color:var(--cu)}
.tag{display:inline-block;margin-top:12px;padding:3px 10px;border:2px solid var(--rust);color:var(--rust);font:700 13px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.board{padding:22px 40px 0;display:grid;gap:10px}
.colh{display:grid;grid-template-columns:78px 52px 1fr 1fr 110px;gap:14px;font:700 12px "JetBrains Mono",monospace;color:var(--cu);text-transform:uppercase;letter-spacing:.14em;padding:0 14px 6px;border-bottom:2px dashed var(--edge)}
.colh span:last-child{text-align:right}
.row{display:grid;grid-template-columns:78px 52px 1fr 1fr 110px;gap:14px;align-items:center;padding:10px 14px;background:linear-gradient(180deg,var(--plate),var(--steel2));border:2px solid var(--edge);border-left:8px solid var(--hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 #0c0d0e}
.row.r1{border-left-color:var(--rust);padding:16px 14px;background:linear-gradient(180deg,#34302d,#262322)}
.row.r2{border-left-color:#c9ced1}.row.r3{border-left-color:var(--cu)}
.plate{font:900 38px/1 "Big Shoulders Stencil Display",sans-serif;text-align:center;padding:4px 0;border:3px double var(--hi);color:#c9ced1;background:#16181a;text-shadow:0 -1px 0 #000}
.r1 .plate{color:#111;background:var(--rust);border:3px double #5b2305;font-size:50px;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.r2 .plate{color:var(--fg)}.r3 .plate{color:var(--cu);border-color:var(--cu)}
.row img{width:48px;height:48px;border:2px solid var(--edge);background:#111;filter:grayscale(.35) contrast(1.05)}
.r1 img{width:52px;height:52px;border-color:var(--rust)}
.who{font:700 24px "Barlow Condensed";text-transform:uppercase;letter-spacing:.05em;word-break:break-all}
.who a{color:inherit;text-decoration:none}.who a:hover{color:var(--rust)}
.r1 .who{font-size:32px}
.when{font:500 12px "JetBrains Mono",monospace;color:#8a8f93;text-transform:uppercase}
.gauge{height:16px;background:repeating-linear-gradient(90deg,#0d0e0f 0 6px,#17191a 6px 8px);border:2px solid #0c0d0e;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--rust) 0 6px,transparent 6px 8px)}
.r2 .gauge i,.r3 .gauge i{background:repeating-linear-gradient(90deg,#aeb4b8 0 6px,transparent 6px 8px)}
.r3 .gauge i{background:repeating-linear-gradient(90deg,var(--cu) 0 6px,transparent 6px 8px)}
.cnt{text-align:right;font:700 34px/1 "JetBrains Mono",monospace;color:var(--fg);background:#101213;border:2px solid #000;padding:6px 10px;box-shadow:inset 0 0 0 1px var(--edge);letter-spacing:.04em}
.r1 .cnt{color:var(--rust);font-size:42px}
.cnt .delta{display:block;margin-top:3px;font:700 14px/1 "JetBrains Mono",monospace;letter-spacing:.04em}
.delta-up{color:#3ddc6a}.delta-up svg{fill:#3ddc6a;vertical-align:-1px;margin-right:4px}.delta-none{color:#5d6367}
.cap{margin-top:10px;font:500 13px "JetBrains Mono",monospace;color:#a9aeb2;letter-spacing:.04em}.cap .up{color:#3ddc6a}
.cnt small{display:block;font:500 10px "JetBrains Mono";color:var(--cu);letter-spacing:.14em;margin-top:2px}
footer{padding:20px 40px 0;font:500 12px "JetBrains Mono",monospace;color:#8a8f93;text-transform:uppercase;letter-spacing:.06em}
footer a{color:var(--cu)}
@media(max-width:640px){header{padding:24px 22px 18px;gap:16px;flex-direction:column;align-items:flex-start}header img{width:96px;height:96px}
.board{padding:18px 16px 0}.colh{display:none}
.row{grid-template-columns:52px 42px 1fr 74px;gap:10px;padding:8px}.row .meter{display:none}.plate{font-size:28px}.r1 .plate{font-size:34px}
.row img{width:40px;height:40px}.who{font-size:19px}.r1 .who{font-size:23px}.cnt{font-size:24px;padding:4px 6px}.r1 .cnt{font-size:28px}footer{padding:18px 16px 0}}
</style>
</head>
<body>
<main>
<i class="rv a"></i><i class="rv b"></i><i class="rv c"></i><i class="rv d"></i>
<div class="haz"></div>
<header>
<img src="logo.png" alt="obs-rust logo">
<div>
<h1>obs<em>-rust</em><br>Leaderboard</h1>
<p class="sub">Ranked by <b>merged pull requests</b> &middot; credit to the original author</p>
<span class="tag" id="tot">Loading...</span>
<p class="cap" id="cap"></p>
</div>
</header>
<section class="board">
<div class="colh"><span>Rank</span><span></span><span>Operator</span><span>Output</span><span>Merged PRs</span></div>
<div id="list" style="display:grid;gap:10px"></div>
</section>
<footer id="foot"></footer>
<div class="haz bot"></div>
</main>
<script>
(async()=>{
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let d;try{d=await (await fetch("leaderboard.json",{cache:"no-store"})).json()}catch(e){document.getElementById("foot").textContent="Could not load leaderboard.json";return}
const C=[...d.contributors].sort((a,b)=>a.rank-b.rank),max=Math.max(1,...C.map(c=>c.merged_prs));
const fmt=s=>new Date(s).toLocaleDateString("en",{month:"short",year:"numeric"});
const gh=l=>"https://github.com/"+encodeURIComponent(l);
document.getElementById("tot").textContent=(d.merged_pr_total||C.reduce((a,c)=>a+c.merged_prs,0))+" merged PRs logged";
document.getElementById("list").innerHTML=C.map(c=>`<div class="row r${c.rank}"><div class="plate">${String(c.rank).padStart(2,"0")}</div><img src="${esc(c.avatar_url)}" alt=""><div><div class="who"><a href="${gh(c.login)}">${esc(c.login)}</a></div><div class="when">${fmt(c.first_contribution)} - ${fmt(c.last_contribution)}</div></div><div class="meter"><div class="gauge"><i style="width:${Math.round(100*c.merged_prs/max)}%"></i></div></div><div class="cnt">${c.merged_prs}${c.today_badge||""}<small>MERGED</small></div></div>`).join("");
if(d.since_caption)document.getElementById("cap").innerHTML=`<span class="up">&#9650;</span> = ${esc(d.since_caption)} &middot; ${d.today_total||0} today`;
document.getElementById("foot").innerHTML=`Updated ${esc(d.generated_pacific||new Date(d.generated_at).toUTCString())} &middot; <a href="https://github.com/${esc(d.repo)}">${esc(d.repo)}</a> &middot; <a href="leaderboard.json">JSON</a>`;
document.body.dataset.ready="1";
})();
</script>
</body>
</html>
