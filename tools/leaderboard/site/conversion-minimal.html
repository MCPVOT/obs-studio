<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>obs-rust Conversion</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800;900&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* The README card (#2321): ONE headline number — the libobs share,
   because libobs is what has to be ported. The rest of the app is allowed to
   stay C++ in the hybrid build, so the whole-app percentage never leads.
   The full breakdown stays on conversion.html, which the image links to. */
:root{--steel:#1b1d1f;--edge:#4a4f53;--fg:#e9e6df;--rust:#e8631a;--cu:#3fa58a;--haz:#f2b705}
*{box-sizing:border-box;margin:0}
body{color:var(--fg);font:600 17px/1.35 "Barlow Condensed",sans-serif;letter-spacing:.02em;padding:12px;background:#17191a}
main{border:3px solid var(--edge);background:var(--steel);box-shadow:0 0 0 2px #0c0d0e,inset 0 0 0 2px #0c0d0e}
.haz{height:10px;background:repeating-linear-gradient(-45deg,var(--haz) 0 10px,#111 10px 20px)}
.card{display:flex;align-items:center;gap:20px;padding:18px 24px}
.card img{width:72px;height:72px;flex:none;filter:drop-shadow(0 3px 0 #000)}
.body{flex:1;min-width:0}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.num{font:900 64px/.9 "Big Shoulders Stencil Display",sans-serif;color:var(--rust)}
.what{font:700 24px "Barlow Condensed";text-transform:uppercase;letter-spacing:.05em}
.gauge{margin-top:12px;height:18px;background:repeating-linear-gradient(90deg,#0d0e0f 0 6px,#17191a 6px 8px);border:2px solid #0c0d0e;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--rust) 0 6px,transparent 6px 8px)}
.sub{margin-top:10px;display:flex;justify-content:space-between;gap:12px;font:500 13px "JetBrains Mono",monospace;color:#a9aeb2;text-transform:uppercase;letter-spacing:.08em}
.sub b{color:var(--cu)}
@media(max-width:480px){.card{padding:14px 16px}.card img{display:none}.num{font-size:52px}.sub{flex-direction:column;gap:4px}}
</style>
</head>
<body>
<main>
<div class="haz"></div>
<div class="card">
<img src="logo.png" alt="">
<div class="body">
<div class="head"><span class="num" id="lib">--</span><span class="what">of libobs is Rust</span></div>
<div class="gauge"><i id="bar" style="width:0"></i></div>
<div class="sub"><span>The rest of the app stays C++</span><span>Click for the full breakdown &rarr;</span></div>
</div>
</div>
</main>
<script>
(async()=>{
let d;try{d=await (await fetch("conversion.json",{cache:"no-store"})).json()}catch(e){return}
const pct=p=>Number(p).toFixed(1)+"%";
const lib=d.libobs.all.percent;
document.getElementById("lib").textContent=pct(lib);
document.getElementById("bar").style.width=Math.min(100,Math.max(0,lib))+"%";
document.body.dataset.ready="1";
})();
</script>
</body>
</html>
