name: Release OBS-Studio-Rust
run-name: Release OBS-Studio-Rust v${{ inputs.version }}${{ inputs.publish && '' || ' (dry run)' }} 🦀
# Builds OBS-Studio-Rust (ENABLE_RUST_LIBOBS=ON) for Linux, macOS and Windows
# and publishes it as a GitHub pre-release tagged obs-studio-rust-v<version>.
#   gh workflow run release-rust.yaml -f version=0.1.0              # build + publish
#   gh workflow run release-rust.yaml -f version=0.1.0 -f publish=false   # build only
# The tag is created by the release itself, so the tag push does not start
# push.yaml's upstream OBS release pipeline. Builds are unsigned.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must equal rust/libobs-rust/Cargo.toml's version
        type: string
        required: true
      publish:
        description: Publish the pre-release (off = build and verify only)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-rust-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  check:
    name: Check version 🏷️
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: check
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/libobs-rust/Cargo.toml | head -1)
          if [ "$VERSION" != "$crate" ]; then
            echo "::error::version $VERSION does not match rust/libobs-rust/Cargo.toml ($crate)"
            exit 1
          fi
          tag="obs-studio-rust-v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }} 🧱
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            runner: ubuntu-26.04
            target: x86_64
          - os: macos
            runner: macos-26
            target: arm64
          - os: windows
            runner: windows-2025-vs2026
            target: x64
    runs-on: ${{ matrix.runner }}
    steps:
      # fetch-depth 0: versionconfig.cmake derives the base OBS version from tags.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.check.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # The build scripts leave ENABLE_RUST_LIBOBS at its default (OFF), and
      # Build-Windows.ps1 does not read it from the environment. Flip the
      # default, as obs-rust/obs-smoke does for all three platforms.
      - name: Enable Rust libobs 🦀
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak 's/option(ENABLE_RUST_LIBOBS \(".*"\) OFF)/option(ENABLE_RUST_LIBOBS \1 ON)/' libobs/CMakeLists.txt
          rm libobs/CMakeLists.txt.bak
          grep -n 'option(ENABLE_RUST_LIBOBS' libobs/CMakeLists.txt | grep -q ' ON)'
          git update-index --assume-unchanged libobs/CMakeLists.txt

      - name: Select Xcode 🍏
        if: matrix.os == 'macos'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          # The macOS CI preset points Xcode's compilation cache at $XCODE_CAS_PATH.
          cas="$HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex"
          mkdir -p "$cas"
          echo "XCODE_CAS_PATH=$cas" >>"$GITHUB_ENV"

      # Corrosion runs cargo inside the CMake build; same soldr as build-project.yaml.
      - name: Set up soldr 🦀
        uses: zackees/setup-soldr@0f223ac68e97fccaaeab026ef1861e5bf73639ac # v0.9.85
        with:
          version: 0.9.31
          shims: true

      - name: Build OBS-Studio-Rust 🧱
        uses: ./.github/actions/build-obs
        with:
          target: ${{ matrix.target }}
          config: RelWithDebInfo

      - name: Package OBS-Studio-Rust 📀
        uses: ./.github/actions/package-obs
        with:
          target: ${{ matrix.target }}
          config: RelWithDebInfo
          package: ${{ matrix.os != 'windows' }}

      - name: Collect and verify 🔎
        shell: bash
        env:
          OS: ${{ matrix.os }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p pkg
          case "$OS" in
            linux) found=(build_ubuntu/obs-studio-*-x86_64-ubuntu-gnu.deb) ;;
            macos) found=(build_macos/obs-studio-*-macos-apple.dmg) ;;
            windows) found=(build_x64/obs-studio-*-windows-x64.zip) ;;
          esac
          src=${found[0]}
          [ -f "$src" ] || { echo "::error::no $OS package found"; exit 1; }
          ext=${src##*.}
          cp "$src" "pkg/OBS-Studio-Rust-$VERSION-$OS-${{ matrix.target }}.$ext"

          # Rust must actually be linked into libobs.
          lib=$(find build_* \( -name obs.dll -o -name 'libobs.so*' -o -path '*libobs.framework/Versions/A/libobs' \) -type f | head -1)
          echo "libobs: $lib"
          grep -a -q '/rustc/' "$lib" || { echo "::error::no Rust code in $lib"; exit 1; }

          # The Linux build must name itself OBS-Studio-Rust <version> (#112).
          if [ "$OS" = linux ]; then
            prefix=build_ubuntu/install/RelWithDebInfo
            v=$(LD_LIBRARY_PATH="$prefix/lib:$prefix/lib/x86_64-linux-gnu" "$prefix/bin/obs" --version)
            echo "$v"
            [[ "$v" == "OBS-Studio-Rust $VERSION"* ]] || { echo "::error::unexpected --version: $v"; exit 1; }
          fi
          ls -la pkg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-studio-rust-${{ matrix.os }}
          path: pkg/
          retention-days: 14

  release:
    name: Publish pre-release 🚀
    needs: [check, build]
    if: inputs.publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: obs-studio-rust-*
          path: dist
          merge-multiple: true

      - name: Create release 🛫
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum OBS-Studio-Rust-* >SHA256SUMS
          cat SHA256SUMS
          cat >notes.md <<EOF
          OBS-Studio-Rust $VERSION: OBS Studio built with \`ENABLE_RUST_LIBOBS=ON\`, so the ported libobs internals run from Rust. Built from [\`${SHA:0:9}\`](https://github.com/$GITHUB_REPOSITORY/commit/$SHA).

          **Pre-release, unsigned.** macOS: right-click → Open the first time. Windows: SmartScreen will warn. Linux: \`sudo apt install ./OBS-Studio-Rust-$VERSION-linux-x86_64.deb\` (Ubuntu 26.04).

          | File | Platform |
          |---|---|
          | \`OBS-Studio-Rust-$VERSION-linux-x86_64.deb\` | Ubuntu 26.04, x86_64 |
          | \`OBS-Studio-Rust-$VERSION-macos-arm64.dmg\` | macOS, Apple silicon |
          | \`OBS-Studio-Rust-$VERSION-windows-x64.zip\` | Windows, x64 |

          Checksums: \`SHA256SUMS\`.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease \
            --title "OBS-Studio-Rust v$VERSION" --notes-file notes.md \
            OBS-Studio-Rust-* SHA256SUMS
