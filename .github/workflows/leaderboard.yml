name: Contributor leaderboard

# Regenerates leaderboard.json + leaderboard.jpg and commits them to the
# `leaderboard` branch only (served by GitHub Pages). Nothing here touches
# master, so the OBS build workflows are not triggered.
#
# Runs every 4 hours (at minute 17, off the top-of-hour rush), and on demand.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/leaderboard
      - uses: actions/checkout@v4
        with:
          ref: leaderboard
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tools/leaderboard/site/* data/
          touch data/.nojekyll
          python3 tools/leaderboard/generate.py --repo "${{ github.repository }}" --out data/leaderboard.json
      - name: Render JPEG
        run: |
          pip install playwright==1.49.1
          playwright install --with-deps chromium
          python3 tools/leaderboard/render.py data
      - name: Commit to leaderboard branch
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "leaderboard: update $(date -u +%FT%H:%MZ)"
          git push origin HEAD:leaderboard
