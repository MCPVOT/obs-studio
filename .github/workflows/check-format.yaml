name: Check Code Formatting 🛠️
on:
  workflow_call:
jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The local gate's pinned uvx tool and file set (#427): brew update,
      # brew install zsh and the formatter took about 75 s to format in 0.3 s.
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: clang-format Check 🐉
        run: uv run ci/local_gate.py --only clang-format

  # swift-format needs a macOS runner, one of the 5 the plan allows; take it
  # only when a Swift file changed (#427).
  swift-changes:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check for Swift Changes 🔎
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -z "$BASE" ]; then
            swift=true
          elif git diff --name-only "$BASE" HEAD -- '*.swift' | grep -q .; then
            swift=true
          else
            swift=false
          fi
          echo "swift=$swift" >> "$GITHUB_OUTPUT"
          echo "Swift files changed: $swift"

  swift-format:
    runs-on: macos-26
    needs: swift-changes
    if: needs.swift-changes.outputs.swift == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: swift-format Check 🔥
        id: swift-format
        uses: ./.github/actions/run-swift-format
        with:
          failCondition: error

  gersemi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The local gate's pinned uvx tool and file set (#427): brew update,
      # brew install zsh and the formatter took about 75 s to format in 0.3 s.
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: gersemi Check 🎛️
        run: uv run ci/local_gate.py --only gersemi

  flatpak-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Flatpak Manifest Check 📦
        id: flatpak-check
        uses: ./.github/actions/flatpak-manifest-validator
        with:
          failCondition: error

  qt-xml-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Qt XML Check 🖼️
        id: qt-xml-check
        uses: ./.github/actions/qt-xml-validator
        with:
          failCondition: error
