name: Run gersemi
description: Runs gersemi and checks for any changes introduced by it
inputs:
  failCondition:
    description: Controls whether failed checks also fail the workflow run
    required: false
    default: never
  workingDirectory:
    description: Working directory for checks
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - name: Check Runner Operating System 🏃‍♂️
      if: runner.os == 'Windows'
      shell: bash
      run: |
        : Check Runner Operating System 🏃‍♂️
        echo "::notice::run-gersemi action requires a macOS-based or Linux-based runner."
        exit 2

    # gersemi checks the whole tree in about a second, so it does not use the
    # changed-files list: a list computed against the wrong base (feature-branch
    # PRs, workflow_dispatch) let an unformatted CMake file through before
    # (obs-rust/obs-studio#13).
    - name: Install Dependencies 🛍️
      if: runner.os == 'Linux'
      shell: bash
      run: |
        : Install Dependencies 🛍️
        echo ::group::Install Dependencies
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH
        "${GITHUB_WORKSPACE}/.github/scripts/retry" brew update
        "${GITHUB_WORKSPACE}/.github/scripts/retry" brew install --quiet zsh
        echo ::endgroup::

    - name: Run gersemi 🎛️
      id: result
      shell: zsh --no-rcs --errexit --pipefail {0}
      working-directory: ${{ github.workspace }}
      run: |
        : Run gersemi 🎛️
        if (( ${+RUNNER_DEBUG} )) setopt XTRACE

        print ::group::Install gersemi
        "${GITHUB_WORKSPACE}/.github/scripts/retry" brew update
        brew trust obsproject/tools
        "${GITHUB_WORKSPACE}/.github/scripts/retry" brew install --quiet obsproject/tools/gersemi@0.25
        print ::endgroup::

        print ::group::Run gersemi
        ./build-aux/run-gersemi --fail-${{ inputs.failCondition }} --check
        print ::endgroup::
