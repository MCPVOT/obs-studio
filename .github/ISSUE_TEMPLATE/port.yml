name: Port a C unit to Rust
description: One C file or unit, following docs/rust-port/testing-policy.md
title: "rust: Port <path>.c to <crate>"
labels: [port, enhancement]
body:
  - type: markdown
    attributes:
      value: Check the tracking issue (#4 lists them) and open PRs first. Claim with a `Claiming: <item>` comment before coding; the claim bot adds the `claimed` label.
  - type: input
    id: unit
    attributes:
      label: Unit
      description: C file(s) and target crate.
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Phase and position
      description: Phase and position in the policy's port order; tracking issue.
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Dependencies and existing tests
      description: Units it depends on; whether a cmocka characterization test exists (if not, it lands first).
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: SIMD/ULP tolerance, per-OS files, threading, header-inline helpers, expected intentional differences.
